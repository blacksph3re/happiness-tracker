[project]
name = "backend"
version = "0.9.2"
description = "Add your description here"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "passlib[argon2]>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "pywebpush>=2.5.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "beartype>=0.22.9",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = [
    # The repo documents classes, functions and attributes, not modules.
    "D100",
    "D104",
    # Sections here do not end with a blank line, which is the house style.
    "D413",
    # `Depends(...)` in a default argument is how FastAPI declares dependencies.
    "B008",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from docstrings: a descriptive name is the documentation.
"tests/*" = ["D101", "D102", "D103", "D106"]
# A migration is mostly Alembic's own template - the revision header, the
# `Union[...]` annotations, the docstring built from the message - plus a body
# it wrote itself. Those are exempt; anything hand-written in the file is not.
"alembic/versions/*" = ["E501", "W291", "D400", "UP007", "UP035"]
